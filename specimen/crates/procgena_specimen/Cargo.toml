[package]
name = "procgena_specimen"
version = "0.1.0"
description = "Tagged specimens that procgena generators hand to each other: detail levels of tagged triangle meshes"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glam = { workspace = true }
procgena_core = { path = "../../../core/crates/procgena_core" }
serde = { workspace = true }
# Only the ECS, with a subset of the features Bevy 0.20.1 turns on, so it
# builds together with the Bevy crates instead of as a separate copy.
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"], optional = true }

[features]
# A `GeneratedSpecimen` component for putting a generated specimen on a Bevy entity.
bevy = ["dep:bevy_ecs"]

[package.metadata.docs.rs]
all-features = true
