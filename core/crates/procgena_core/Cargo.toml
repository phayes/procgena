[package]
name = "procgena_core"
version = "0.1.0"
description = "Engine-free rules every procgena level shares: hashing, random numbers and ground shapes"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Serialize and deserialize the level-of-detail and quality types.
serde = ["dep:serde"]

[dependencies]
glam = { workspace = true }
serde = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
