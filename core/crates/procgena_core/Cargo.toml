[package]
name = "procgena_core"
version = "0.1.0"
description = "Engine-free rules every procgena level shares: hashing, random numbers, ground shapes and preset files"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glam = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
# `preserve_order` keeps settings in the order their structs declare them
# when a preset file is written.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_path_to_error = { workspace = true }
