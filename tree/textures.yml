# Bark and leaf textures for procgena_tree, used by the `textures` tool:
#   uv run --project tools textures <command> tree
# See tools/README.md for the commands. Only add textures whose licence allows
# commercial use (CC0 or MIT).

# Folder in the public gs://ze_textures bucket that holds these textures.
bucket: tree

# How surface maps are stored. `roughness` keeps roughness as its own image,
# with the same value in red, green and blue; `orh` packs ambient occlusion,
# roughness and height into one image.
layout: roughness

# Folder under assets/textures/ for every set below, unless a set names its own.
category: bark

# Bark texture sets, in manifest order. The id names the output files and
# BarkOptions::kind. `source` defaults to polyhaven and `source_id` to the id.
# Sources:
#   polyhaven  https://polyhaven.com/a/<source_id>
#   ambientcg  https://ambientcg.com/a/<source_id>
# Choose textures that provide 2k JPEG colour, OpenGL normal and roughness maps.
sets:
  - id: bark_brown_02
  - id: bark_brown_01
  - id: bark_willow
  - id: bark_willow_02
  - id: pine_bark
  - id: tree_bark_03
  - id: palm_tree_bark
  - id: sakura_bark
  - id: japanese_sycamore
  - id: japanese_hackberry_bark
  - id: chinese_cedar_bark
  - id: japanese_zelkova_bark
  - id: japanese_camphor_bark
  - id: knotted_pine_bark
  - id: jolcham_oak_bark_01
  - id: eucalyptus_bark
  - id: trident_maple_bark
  - id: palm_bark
  - id: japanese_cedar_bark
  - id: bark_platanus
  - id: bark_bluegum
  - id: metasequoia_bark
  - id: chinese_hackberry_bark
  - {id: Bark001, source: ambientcg}
  - {id: Bark002, source: ambientcg}
  - {id: Bark003, source: ambientcg}
  - {id: Bark009, source: ambientcg}
  - {id: Bark014, source: ambientcg}
  - {id: Bark016, source: ambientcg}

# Leaf cards: transparent images of leaves or branch tips, one size each.
# Each kind is a LeafOptions::kind. `path` is relative to prior_art/:
#   ez-tree  a colour PNG with transparency from the ez-tree demo (MIT).
#            Clone https://github.com/dgreenheck/ez-tree into prior_art/ez-tree.
#   nobiax   a folder with diffuse.tga (colour with transparency) and
#            normal.tga (OpenGL +Y) from Nobiax's "Free 3D branches textures"
#            packs 01-04 (CC0). Extract each pack's .7z into prior_art/.
# `recolor` regrades the colour image to green; see tools/README.md.
cards:
  category: leaves
  # Also write a 256 x 256 "clump" image per kind: several leaves on one card,
  # for distant trees.
  clump_images: true
  kinds:
    - {kind: ash, source: ez-tree, path: ez-tree/src/app/public/textures/leaves/ash.png, title: Ash}
    - {kind: aspen, source: ez-tree, path: ez-tree/src/app/public/textures/leaves/aspen.png, title: Aspen}
    - {kind: oak, source: ez-tree, path: ez-tree/src/app/public/textures/leaves/oak.png, title: Oak}
    - {kind: pine, source: ez-tree, path: ez-tree/src/app/public/textures/leaves/pine.png, title: Pine}
    - {kind: aspen_autumn, source: nobiax, path: "free_3d_branches_textures_01_by_yughues_d4oxx3r/#21", title: "Quaking aspen, autumn"}
    - {kind: european_aspen, source: nobiax, path: "free_3d_branches_textures_01_by_yughues_d4oxx3r/#22", title: European aspen}
    - {kind: bigtooth_aspen, source: nobiax, path: "free_3d_branches_textures_01_by_yughues_d4oxx3r/#23", title: Bigtooth aspen}
    - {kind: alder_buckthorn, source: nobiax, path: "free_3d_branches_textures_01_by_yughues_d4oxx3r/#24", title: "Alder buckthorn, autumn"}
    - {kind: smoke_bush, source: nobiax, path: "free_3d_branches_textures_01_by_yughues_d4oxx3r/#25", title: Purple smoke bush}
    - {kind: field_maple_autumn, source: nobiax, path: "free_3d_branches_textures_02_by_yughues_d4pgt2v/#26", title: "Field maple, autumn"}
    - {kind: bamboo, source: nobiax, path: "free_3d_branches_textures_02_by_yughues_d4pgt2v/#27", title: Bamboo}
    - {kind: fir, source: nobiax, path: "free_3d_branches_textures_02_by_yughues_d4pgt2v/#28", title: Fir}
    - {kind: white_pine, source: nobiax, path: "free_3d_branches_textures_02_by_yughues_d4pgt2v/#29", title: White pine}
    - {kind: arborvitae_autumn, source: nobiax, path: "free_3d_branches_textures_02_by_yughues_d4pgt2v/#30", title: "Arborvitae, autumn"}
    - {kind: birch_autumn, source: nobiax, path: "free_3d_branches_textures_03_by_yughues_d4rcjmu/#31", title: "Birch, autumn"}
    - {kind: larch, source: nobiax, path: "free_3d_branches_textures_03_by_yughues_d4rcjmu/#32", title: Larch}
    - {kind: black_locust, source: nobiax, path: "free_3d_branches_textures_03_by_yughues_d4rcjmu/#33", title: Black locust}
    - {kind: olive, source: nobiax, path: "free_3d_branches_textures_03_by_yughues_d4rcjmu/#34", title: Olive}
    - {kind: cotoneaster, source: nobiax, path: "free_3d_branches_textures_03_by_yughues_d4rcjmu/#35", title: Cotoneaster with berries}
    - {kind: bare_twig_1, source: nobiax, path: "free_3d_branches_textures_04_by_yughues_d4rlc6o/#36", title: Bare twig 1}
    - {kind: bare_twig_2, source: nobiax, path: "free_3d_branches_textures_04_by_yughues_d4rlc6o/#37", title: Bare twig 2}
    - {kind: white_oak_autumn, source: nobiax, path: "free_3d_branches_textures_04_by_yughues_d4rlc6o/#38", title: "White oak, autumn"}
    - {kind: white_oak, source: nobiax, path: "free_3d_branches_textures_04_by_yughues_d4rlc6o/#39", title: White oak}
    - {kind: white_oak_dead, source: nobiax, path: "free_3d_branches_textures_04_by_yughues_d4rlc6o/#40", title: "White oak, dead leaves"}
    # Nobiax's bronze autumn arborvitae in a bright cedar green.
    - kind: cedar
      source: nobiax
      path: "free_3d_branches_textures_02_by_yughues_d4pgt2v/#30"
      title: Cedar (arborvitae recoloured green)
      recolor: {dark: "#0e1f08", mid: "#447224", light: "#b4d070", twig_level: "70%,95%", twig_modulate: "160,40"}
    # Nobiax's autumn field maple in a bright summer green.
    - kind: maple
      source: nobiax
      path: "free_3d_branches_textures_02_by_yughues_d4pgt2v/#26"
      title: Maple (field maple recoloured green)
      recolor: {dark: "#16330a", mid: "#4c8a26", light: "#c4e07a", twig_level: "45%,70%", twig_modulate: "150,35"}
