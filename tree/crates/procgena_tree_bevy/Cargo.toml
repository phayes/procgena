[package]
name = "procgena_tree_bevy"
version = "0.1.0"
description = "Bevy plugin for procgena_tree procedural trees: meshes, materials, wind and LOD"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
procgena_tree = { path = "../procgena_tree" }
procgena_core = { path = "../../../core/crates/procgena_core" }
procgena_core_bevy = { path = "../../../core/crates/procgena_core_bevy" }
procgena_specimen = { path = "../../../specimen/crates/procgena_specimen", features = ["bevy"] }
procgena_impostor = { path = "../../../impostor/crates/procgena_impostor" }
serde_json = { workspace = true }
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_pbr",
    "bevy_mikktspace",
    "ktx2",
    "zstd_rust",
] }

[dev-dependencies]
bevy = { version = "0.20.1", features = ["free_camera"] }
# Allows the viewer example to save screenshots as PNG files.
image = { version = "0.25", default-features = false, features = ["png"] }
