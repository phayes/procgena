# A built-in TreeScatterPreset. Copy it, change what you like, and read it
# with TreeScatterPreset::from_yaml, or name it as the `base` of your own
# file and give only what differs.
name: Pine Stand
description: Pines of three sizes, the young ones in dense clumps.
group: Conifer
tree_scatter:
  default_seed: 4
  trees:
    - { tree: pine_small, density_scale: 0.3, clustering: 0.6 }
    - { tree: pine_large, density_scale: 0.4 }
    - { tree: pine_medium, density_scale: 0.6 }
