# A built-in TreeScatterPreset. Copy it, change what you like, and read it
# with TreeScatterPreset::from_yaml, or name it as the `base` of your own
# file and give only what differs.
name: Oak Woodland
description: Medium oaks with a few large ones, small stands of ash and scattered bushes.
group: Woodland
tree_scatter:
  default_seed: 1
  trees:
    - { key: shrubs, tree: bush_1, density_scale: 0.1, clustering: 0.6, variants: 3 }
    - { key: ashes, tree: ash_medium, density_scale: 0.2, clustering: 0.4 }
    - { key: old_oaks, tree: oak_large, density_scale: 0.3, variants: 3 }
    - { key: oaks, tree: oak_medium, density_scale: 0.6 }
