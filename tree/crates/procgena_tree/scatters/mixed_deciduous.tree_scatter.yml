# A built-in TreeScatterPreset. Copy it, change what you like, and read it
# with TreeScatterPreset::from_yaml, or name it as the `base` of your own
# file and give only what differs.
name: Mixed Deciduous
description: Big-leaf maple, ash, aspen and oak, each in loose stands.
group: Woodland
tree_scatter:
  default_seed: 3
  trees:
    - { tree: big_leaf_maple_large, density_scale: 0.3, clustering: 0.3, variants: 3 }
    - { tree: ash_large, density_scale: 0.3, clustering: 0.3, variants: 3 }
    - { tree: aspen_medium, density_scale: 0.2, clustering: 0.6 }
    - { tree: oak_medium, density_scale: 0.5 }
