# A built-in TreeScatterPreset. Copy it, change what you like, and read it
# with TreeScatterPreset::from_yaml, or name it as the `base` of your own
# file and give only what differs.
name: Winter Copse
description: Leafless winter thickets with a few pussy willows.
group: Seasonal
tree_scatter:
  default_seed: 8
  trees:
    - { key: willows, tree: spring_pussy_willow, density_scale: 0.1, clustering: 0.5 }
    - { key: thicket, tree: winter_thicket, density_scale: 0.8 }
