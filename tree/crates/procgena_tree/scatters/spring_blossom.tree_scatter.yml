# A built-in TreeScatterPreset. Copy it, change what you like, and read it
# with TreeScatterPreset::from_yaml, or name it as the `base` of your own
# file and give only what differs.
name: Spring Blossom
description: Flowering dogwoods with clumps of pussy willow in catkin.
group: Seasonal
tree_scatter:
  default_seed: 7
  trees:
    - { key: willows, tree: spring_pussy_willow, density_scale: 0.05, clustering: 0.5 }
    - { key: dogwoods, tree: flowering_dogwood, density_scale: 0.8 }
