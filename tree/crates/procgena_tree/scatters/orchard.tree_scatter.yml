# A built-in TreeScatterPreset. Copy it, change what you like, and read it
# with TreeScatterPreset::from_yaml, or name it as the `base` of your own
# file and give only what differs.
name: Orchard
description: Apple trees spread evenly, standing straight and of similar size.
group: Cultivated
tree_scatter:
  default_seed: 6
  variation: { scale_jitter: 0.08, lean: 1.0, max_slope: 20.0 }
  trees:
    - { tree: apple, density: 150.0, spacing: 3.0 }
