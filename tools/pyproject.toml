[project]
name = "procgena-tools"
version = "0.1.0"
description = "Command-line tools for the procgena workspace: texture download, preparation and publishing"
requires-python = ">=3.11"
dependencies = [
    # Reads each project's textures.yml.
    "pyyaml>=6",
    # The key-card command's image keying and normal maps.
    "numpy>=2",
    "pillow>=11",
    "scipy>=1.14",
]

[project.scripts]
textures = "procgena_tools.textures.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["procgena_tools"]
