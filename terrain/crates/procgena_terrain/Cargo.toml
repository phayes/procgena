[package]
name = "procgena_terrain"
version = "0.1.0"
description = "Labelled procedural terrain regions that join seamlessly and build in chunks"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["rayon"]
# Sample tiles across multiple CPU threads. The results are the same without it.
rayon = ["dep:rayon"]

[dependencies]
glam = { workspace = true }
procgena_core = { path = "../../../core/crates/procgena_core" }
rayon = { workspace = true, optional = true }
serde = { workspace = true }
spade = "2.15"

[package.metadata.docs.rs]
all-features = true
