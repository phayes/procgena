# Ground textures for the terrain's material catalogue (procgena_terrain's
# `ground` module), used by the `textures` tool:
#   uv run --project tools textures <command> terrain
# See tools/README.md for the commands. Only add CC0 textures: free to use,
# including in commercial projects.

# Folder in the public gs://ze_textures bucket that holds these textures.
bucket: terrain

# How surface maps are stored. `orh` packs ambient occlusion, roughness and
# height into one image; ground blending reads the height.
layout: orh

# Sizes written for every set. 512 is the default detail (level 1), 1k the
# opt-in full detail (level 0), and 128 the small version for low quality.
# Every set of one size must be square, so the sets stack into one array.
sizes: ["128", "512", "1k"]

# Surface texture sets, in manifest order. The id names the output files and
# the ground material's `texture`; `category` names the folder under
# assets/textures/. `source` defaults to polyhaven and `source_id` to the id.
# Sources:
#   polyhaven  https://polyhaven.com/a/<source_id>
#   ambientcg  https://ambientcg.com/a/<source_id>
# Choose textures that provide 2k JPEG colour, OpenGL normal, roughness and
# height maps.
#
# `average` is the colour image's average in linear RGB. The ground shader
# tints each texture by its material's colour divided by this average, so
# the ground keeps the material's colour where textures stop. After adding
# or changing a set, run `textures average-colors terrain` and copy its
# numbers here.
sets:
  - {id: mud_forest, category: soil, average: [0.0434, 0.0224, 0.0082]}
  - {id: forrest_ground_03, category: litter, average: [0.3564, 0.2351, 0.1481]}
  - {id: moss_002, category: moss, source: ambientcg, source_id: Moss002, average: [0.0761, 0.1419, 0.0116]}
  - {id: leaves_forest_ground, category: litter, average: [0.2005, 0.1198, 0.0468]}
  - {id: dry_decay_leaves, category: litter, average: [0.1737, 0.0767, 0.0356]}
  - {id: rock_face_03, category: rock, average: [0.2334, 0.1462, 0.0843]}
