[package]
name = "procgena"
description = "Desktop studio for procedural trees, plants and rocks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The procgena crates' Bevy features, plus the window, UI and feathers widgets
# the studio is built from.
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_mikktspace",
    "tonemapping_luts",
    "ktx2",
    "zstd_rust",
    "bevy_winit",
    "bevy_window",
    # bevy_winit 0.20.1 does not compile without it once picking is enabled.
    "custom_cursor",
    "x11",
    "wayland",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "bevy_picking",
    "ui_picking",
    "bevy_input_focus",
    "bevy_feathers",
    "bevy_scene",
] }
procgena_biome = { path = "../biome/crates/procgena_biome" }
procgena_biome_bevy = { path = "../biome/crates/procgena_biome_bevy" }
procgena_core = { path = "../core/crates/procgena_core" }
procgena_tree = { path = "../tree/crates/procgena_tree", features = ["export-obj", "export-gltf"] }
procgena_tree_bevy = { path = "../tree/crates/procgena_tree_bevy" }
procgena_impostor = { path = "../impostor/crates/procgena_impostor" }
procgena_plant_bevy = { path = "../plant/crates/procgena_plant_bevy" }
procgena_stone = { path = "../stone/crates/procgena_stone", features = ["export-obj", "export-gltf"] }
procgena_stone_bevy = { path = "../stone/crates/procgena_stone_bevy" }
procgena_clump = { path = "../clump/crates/procgena_clump" }
procgena_clump_bevy = { path = "../clump/crates/procgena_clump_bevy" }
procgena_fruit = { path = "../fruit/crates/procgena_fruit", features = ["export-obj", "export-gltf"] }
procgena_fruit_bevy = { path = "../fruit/crates/procgena_fruit_bevy" }
procgena_mushroom = { path = "../mushroom/crates/procgena_mushroom", features = ["export-obj", "export-gltf"] }
procgena_mushroom_bevy = { path = "../mushroom/crates/procgena_mushroom_bevy" }
procgena_deadwood = { path = "../deadwood/crates/procgena_deadwood", features = ["export-obj", "export-gltf"] }
procgena_deadwood_bevy = { path = "../deadwood/crates/procgena_deadwood_bevy" }
procgena_terrain = { path = "../terrain/crates/procgena_terrain" }
procgena_terrain_bevy = { path = "../terrain/crates/procgena_terrain_bevy" }
# Download texture images, verify their contents and cache them for later exports.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
dirs = "6"
# Runs texture downloads on their own threads, as Bevy's web asset reader does.
blocking = "1.7"
serde_json = { workspace = true }
# The project file, procgena.yml.
serde = { workspace = true }
serde-saphyr = { workspace = true }
# Native file dialogs.
rfd = "0.18"
