# The lumberjack demo's tunables: only what differs from the built-in
# `standard` set (see src/settings.rs for every value and its meaning).
base: standard
name: Lumberjack
description: The tunables the demo plays with.
demo:
  # No roads and no rivers: the land builds much faster without them.
  # Set `roads: true` and a `river_density` such as 1.0 to bring them back.
  land: { roads: false, river_density: 0.0 }
