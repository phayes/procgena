[package]
name = "procgena_mushroom_bevy"
version = "0.1.0"
description = "Bevy plugin for procgena_mushroom: mushrooms, clusters and scatter with levels of detail"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
procgena_core = { path = "../../../core/crates/procgena_core" }
procgena_mushroom = { path = "../procgena_mushroom" }
procgena_specimen = { path = "../../../specimen/crates/procgena_specimen", features = ["bevy"] }
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_pbr",
] }

[dev-dependencies]
bevy = { version = "0.20.1", features = ["free_camera"] }

[package.metadata.docs.rs]
all-features = true
