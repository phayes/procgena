# optional: a missing one comes from `base`, a built-in preset's key.
name: Moss
description: "Very short, wide and folded: a moss or lichen carpet, gathered into small cushions."
group: Ground cover
plant:
  density: 200.0
  height:
  - 0.02
  - 0.07
  width: 0.025
  lean: 0.25
  root_occlusion: 0.55
  translucency: 0.35
  specular: 0.15
  tufts: 0.25
  tuft_size: 0.35
  segment:
    stiffness: 0.45
    droop: 0.45
    fold: 0.35
    root_color:
    - 0.03
    - 0.07
    - 0.03
    tip_color:
    - 0.14
    - 0.3
    - 0.13
