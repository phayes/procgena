# The `marram` plant preset as a file. Copy it, edit it, and load it with
# `asset_server.load("path/to/copy.plant.yml")`. Every setting is
# optional: a missing one comes from `base`, a built-in preset's key.
name: Marram
description: Blue-grey, rolled, waxy dune grass, gathered in separate clumps.
group: Grasses
plant:
  density: 45.0
  height:
  - 0.5
  - 0.95
  width: 0.012
  lean: 0.45
  root_occlusion: 0.4
  translucency: 0.35
  specular: 0.6
  tufts: 1.0
  tuft_size: 1.1
  segment:
    stiffness: 0.55
    droop: 0.55
    twist: 0.15
    fold: 0.8
    root_color:
    - 0.3
    - 0.3
    - 0.22
    tip_color:
    - 0.58
    - 0.64
    - 0.5
