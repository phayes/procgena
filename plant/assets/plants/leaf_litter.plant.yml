# The `leaf_litter` plant preset as a file. Copy it, edit it, and load it with
# `asset_server.load("path/to/copy.plant.yml")`. Every setting is
# optional: a missing one comes from `base`, a built-in preset's key.
name: Leaf litter
description: "Wide, flat, drooping: fallen leaves lying over the ground."
group: Ground cover
plant:
  density: 40.0
  height:
  - 0.05
  - 0.15
  width: 0.05
  lean: 0.5
  root_occlusion: 0.5
  translucency: 0.25
  specular: 0.1
  segment:
    droop: 0.7
    twist: 0.15
    fold: 0.3
    root_color:
    - 0.12
    - 0.08
    - 0.04
    tip_color:
    - 0.4
    - 0.28
    - 0.14
