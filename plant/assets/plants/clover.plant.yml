# The `clover` plant preset as a file. Copy it, edit it, and load it with
# `asset_server.load("path/to/copy.plant.yml")`. Every setting is
# optional: a missing one comes from `base`, a built-in preset's key.
name: Clover
description: Low, broad, dark leaves lying over, like clover.
group: Ground cover
plant:
  density: 100.0
  height:
  - 0.08
  - 0.2
  width: 0.035
  lean: 0.35
  root_occlusion: 0.5
  translucency: 0.4
  specular: 0.0
  segment:
    stiffness: 0.5
    droop: 0.7
    root_color:
    - 0.04
    - 0.1
    - 0.04
    tip_color:
    - 0.16
    - 0.34
    - 0.12
