# The `forest_moss` Scatter preset as a file. Copy it, edit it, and load it with
# `asset_server.load("path/to/copy.plant_scatter.yml")`. Every setting is
# optional: a missing one comes from `base`, a built-in preset's key.
name: Forest moss
description: A dense carpet of very short, wide moss, in dark patches.
group: Forest
plant_scatter:
  density_scale: 1.1
  variation:
    patch_color:
    - 0.2
    - 0.34
    - 0.15
    patch_amount: 0.35
    patch_size: 3.0
    dry_tips: 0.05
    dead_share: 0.02
    bare_share: 0.05
    bare_patch_size: 1.2
  ground_tint:
    color:
    - 0.12
    - 0.09
    - 0.05
    amount: 0.35
  plants:
  - plant: moss
