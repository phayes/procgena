# The `nettle` plant preset as a file. Copy it, edit it, and load it with
# `asset_server.load("path/to/copy.plant.yml")`. Every setting is
# optional: a missing one comes from `base`, a built-in preset's key.
name: Nettle
description: |-
  Stinging nettle with upright stems and drooping, pointed leaves.

  Each opposite pair turns a quarter-turn from the previous pair.
group: Understory
plant:
  density: 5.0
  height:
  - 0.6
  - 1.0
  width: 0.006
  lean: 0.08
  stems_per_plant: 4
  translucency: 0.4
  specular: 0.1
  segment:
    stiffness: 0.7
    droop: 0.05
    root_color:
    - 0.08
    - 0.16
    - 0.05
    tip_color:
    - 0.16
    - 0.3
    - 0.09
  levels:
  - count: 16
    arrangement: opposite
    attachment_start: 0.12
    length: 0.2
    length_envelope: 0.35
    width: 0.55
    angle: 0.25
    spread: 0.5
    segment:
      profile: 0.6
      stiffness: 0.55
      droop: 0.45
      twist: 0.03
      fold: 0.1
      root_color:
      - 0.05
      - 0.13
      - 0.04
      tip_color:
      - 0.14
      - 0.3
      - 0.08
  - count: 0
    arrangement: opposite
    attachment_start: 0.0
    length: 0.0
    length_envelope: 0.5
    width: 0.0
    angle: 0.0
    spread: 0.0
    segment:
      profile: 0.0
      stiffness: 0.5
      droop: 0.0
      twist: 0.0
      fold: 0.0
      root_color:
      - 0.06
      - 0.13
      - 0.03
      tip_color:
      - 0.38
      - 0.55
      - 0.16
