  lean: 0.04
  root_occlusion: 0.7
  translucency: 0.35
  head_length: 0.16
  head_width: 0.035
  head_color:
  - 0.3
  - 0.17
  - 0.08
  segment:
    stiffness: 0.85
    root_color:
    - 0.1
    - 0.14
    - 0.05
    tip_color:
    - 0.3
    - 0.38
    - 0.14
