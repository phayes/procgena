# The `fern` plant preset as a file. Copy it, edit it, and load it with
# `asset_server.load("path/to/copy.plant.yml")`. Every setting is
# optional: a missing one comes from `base`, a built-in preset's key.
name: Fern
description: |-
  A fern with six arching fronds and fourteen leaflet pairs per frond.

  Grows two plants per square metre on its own. Most forest floors look right with one or two, so scale it down under other plants.
group: Ground cover
plant:
  density: 2.0
  height:
  - 0.5
  - 0.95
  width: 0.007
  lean: 0.45
  stems_per_plant: 6
  translucency: 0.5
  specular: 0.2
  segment:
    droop: 0.55
    twist: 0.04
    fold: 0.25
    root_color:
    - 0.09
    - 0.12
    - 0.04
    tip_color:
    - 0.2
    - 0.34
    - 0.1
  levels:
  - count: 28
    arrangement: opposite
    attachment_start: 0.25
    length: 0.3
    length_envelope: 0.3
    width: 0.22
    angle: 0.22
    spread: 0.0
    segment:
      profile: 0.3
      stiffness: 0.45
      droop: 0.25
      twist: 0.0
      fold: 0.15
      root_color:
      - 0.07
      - 0.16
      - 0.05
      tip_color:
