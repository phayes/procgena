# The `lawn_grass` plant preset as a file. Copy it, edit it, and load it with
# `asset_server.load("path/to/copy.plant.yml")`. Every setting is
# optional: a missing one comes from `base`, a built-in preset's key.
name: Lawn grass
description: Short, fine, stiff blades for a mown lawn.
group: Grasses
plant:
  density: 250.0
  height:
  - 0.05
  - 0.12
  width: 0.008
  lean: 0.1
  root_occlusion: 0.4
  translucency: 0.4
  specular: 0.2
  segment:
    stiffness: 0.7
    root_color:
    - 0.04
    - 0.1
    - 0.03
    tip_color:
    - 0.22
    - 0.42
    - 0.1
