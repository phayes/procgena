[package]
name = "procgena_biome_bevy"
version = "0.1.0"
description = "Bevy drawing for procgena_biome: an Ecotope's Scatters over a patch of ground"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
procgena_biome = { path = "../procgena_biome" }
procgena_core = { path = "../../../core/crates/procgena_core" }
procgena_deadwood_bevy = { path = "../../../deadwood/crates/procgena_deadwood_bevy" }
procgena_mushroom_bevy = { path = "../../../mushroom/crates/procgena_mushroom_bevy" }
procgena_stone_bevy = { path = "../../../stone/crates/procgena_stone_bevy" }
procgena_terrain = { path = "../../../terrain/crates/procgena_terrain" }
procgena_terrain_bevy = { path = "../../../terrain/crates/procgena_terrain_bevy" }
procgena_tree_bevy = { path = "../../../tree/crates/procgena_tree_bevy" }
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_pbr",
] }

[dev-dependencies]
bevy = { version = "0.20.1", features = ["free_camera"] }
procgena_mushroom = { path = "../../../mushroom/crates/procgena_mushroom" }

[package.metadata.docs.rs]
all-features = true
