# A built-in EcotopePreset. Copy it, change what you like, and read it with
# EcotopePreset::from_yaml, or name it as the `base` of your own file and
# give only what differs.
name: Pine forest floor
description: Pines of three sizes over boulders, mossy fallen logs, porcini and a few fly agarics.
group: Forest
ecotope:
  default_seed: 11
  scatters:
    pines:
      priority: 900
      clearance: 0.6
      kind: tree
      density_scale: 0.15
      trees:
        - { tree: pine_small, density_scale: 0.3, clustering: 0.6 }
        - { tree: pine_large, density_scale: 0.4 }
        - { tree: pine_medium, density_scale: 0.6 }
    boulders:
      priority: 850
      clearance: 0.3
      kind: stone
      classes:
        - stone: lichen_boulder
          variants: 4
          density: 0.006
          spacing: 5.0
          size: [0.5, 1.1]
          max_slope: 30.0
          patchiness: 0.3
          patch_size: 20.0
        - stone: river_stone
          variants: 3
          density: 0.02
          spacing: 1.5
          members: [1, 3]
          cluster_radius: 0.6
          size: [0.6, 1.2]
          patchiness: 0.4
          patch_size: 8.0
    logs:
      priority: 800
      clearance: 0.3
      kind: deadwood
      piece: mossy_log
      density: 0.012
      min_spacing: 4.0
      variants: 3
      diameter: [0.2, 0.45]
      length: [2.0, 5.0]
      decay: [1.0, 3.0]
    porcini:
      priority: 200
      clearance: 0.1
      kind: mushroom
      mushroom: porcini
      density: 0.15
      min_spacing: 0.8
      scale_min: 0.8
      scale_max: 1.3
      specimens: 3
    fly_agarics:
      priority: 190
      clearance: 0.1
      kind: mushroom
      mushroom: fly_agaric
      density: 0.03
      min_spacing: 1.5
      scale_min: 0.8
      scale_max: 1.2
      specimens: 2
