[package]
name = "procgena_fruit_bevy"
version = "0.1.0"
description = "Bevy plugin for procgena_fruit: fruit and flower clusters with levels of detail"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
procgena_core = { path = "../../../core/crates/procgena_core" }
procgena_core_bevy = { path = "../../../core/crates/procgena_core_bevy" }
procgena_fruit = { path = "../procgena_fruit" }
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_pbr",
] }

[package.metadata.docs.rs]
all-features = true
